<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Horaires Pro Diagnostic</title><meta name="theme-color" content="#174f86"><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d13;color:#fff;margin:0;padding:18px;max-width:760px;margin-inline:auto}h1{margin-top:0}.card{background:#191c21;border:1px solid #3b4350;border-radius:16px;padding:16px;margin-bottom:14px}input,button{width:100%;min-height:48px;margin:6px 0;padding:10px;border-radius:11px;font:inherit}input{background:#10151d;border:1px solid #3b4350;color:#fff}button{background:#1689f4;border:0;color:#fff;cursor:pointer}button.secondary{background:#242830;border:1px solid #3b4350}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10151d;padding:12px;border-radius:10px;color:#cfe6fb}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><h1>Horaires Pro</h1><div class="card"><h2>1. Connexion</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe"><div class="row"><button id="register">Créer un compte</button><button class="secondary" id="login">Se connecter</button></div><button class="secondary" id="logout" hidden>Se déconnecter</button></div><div class="card"><h2>2. Journée de test</h2><input id="date" type="date"><input id="uid" placeholder="UID connecté" readonly><button id="save">Enregistrer une journée de test</button><button class="secondary" id="read">Lire la journée de test</button></div><div class="card"><h2>Résultat technique</h2><pre id="result">En attente...</pre></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyCTz-YS4aaOS81XvDUFx3tiBISh0V7oUHo',authDomain:'rh-frb.firebaseapp.com',projectId:'rh-frb',storageBucket:'rh-frb.firebasestorage.app',messagingSenderId:'1069409309284',appId:'1:1069409309284:web:cac99c3a2457eef6a58571'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user=null;function today(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*6e4).toISOString().slice(0,10)}function out(t){$('result').textContent=t}function path(){return user?`timesheets/${user.uid}_${$('date').value}`:'(aucun chemin)'}$('date').value=today();onAuthStateChanged(auth,u=>{user=u;if(u){$('uid').value=u.uid;out(`Connexion réussie\nEmail: ${u.email}\nUID: ${u.uid}\nChemin attendu: ${path()}`);$('logout').hidden=false}else{$('uid').value='';$('logout').hidden=true;out('Non connecté')}});$('register').onclick=async()=>{try{const c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);out(`COMPTE CRÉÉ\nEmail: ${c.user.email}\nUID: ${c.user.uid}`)}catch(e){out(`ERREUR CRÉATION\n${e.code}\n${e.message}`)}};$('login').onclick=async()=>{try{const c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);out(`CONNEXION RÉUSSIE\nEmail: ${c.user.email}\nUID: ${c.user.uid}`)}catch(e){out(`ERREUR CONNEXION\n${e.code}\n${e.message}`)}};$('logout').onclick=()=>signOut(auth);$('save').onclick=async()=>{if(!user)return out('ERREUR: non connecté');const date=$('date').value,id=`${user.uid}_${date}`,data={uid:user.uid,email:user.email,date,mission:'Test',zone:'Test',team:'Test',car:'Test',assignment:'Test',morningStart:'08:00',morningEnd:'12:00',afternoonStart:'13:00',dayEnd:'17:00',totalMinutes:480,updatedAt:serverTimestamp()};try{await setDoc(doc(db,'timesheets',id),data,{merge:true});out(`ÉCRITURE RÉUSSIE\nCollection: timesheets\nDocument: ${id}\nUID écrit: ${data.uid}\nDate: ${data.date}`)}catch(e){out(`ERREUR ÉCRITURE\n${e.code}\n${e.message}\nChemin: timesheets/${id}`)}};$('read').onclick=async()=>{if(!user)return out('ERREUR: non connecté');const date=$('date').value,id=`${user.uid}_${date}`;try{const snap=await getDoc(doc(db,'timesheets',id));out(snap.exists()?`LECTURE RÉUSSIE\nDocument trouvé: timesheets/${id}\n${JSON.stringify(snap.data(),null,2)}`:`LECTURE RÉUSSIE MAIS DOCUMENT ABSENT\nDocument recherché: timesheets/${id}`)}catch(e){out(`ERREUR LECTURE\n${e.code}\n${e.message}\nChemin: timesheets/${id}`)}};</script></body></html>
