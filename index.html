<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RH-FRB · Relevé d'heures</title><style>body{margin:0;padding:16px;background:#10151d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto}.card{background:#191c21;border:1px solid #3b4350;border-radius:16px;padding:16px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.button{min-height:46px;border:0;border-radius:12px;padding:0 16px;background:#1689f4;color:#fff;cursor:pointer}.history-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:1px solid #3b4350}.history-row:first-child{border-top:0}.muted{color:#aab4c2}.message{margin-top:12px;padding:10px;background:#164b78;border-radius:10px}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.history-row{grid-template-columns:1fr}}</style></head><body><main><section class="card top"><div><h1>RH-FRB · Relevé d'heures</h1><p class="muted">Historique avec numéro de semaine et export Excel</p><p id="auth-status" class="muted">Non connecté</p></div><button id="export-xlsx" class="button" type="button">Exporter XLSX</button></section><section class="card"><h2>Historique du pointage</h2><p class="muted">Les autres informations sont affichées dans chaque ligne.</p><div id="history-list"></div><div id="message" class="message" hidden></div></section></main><script type="module" src="app.js"></script></body></html>
